<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8" />
  <title>밴픽 결과</title>
  <style>
    body {
      padding: 20px;
    }

    .group-wrapper {
      display: flex;
      align-items: center;
      justify-content: flex-start;
      margin-bottom: 30px;
    }

    .group {
      width: 100%;
      max-width: 400px;
      min-height: 150px;
      border: 2px solid #888;
      padding: 16px;
      margin-bottom: 20px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    }

    .section-title {
      font-weight: bold;
      margin-top: 10px;
    }

    .team {
      margin-left: 10px;
    }

    .champ {
      display: inline-block;
      margin-right: 8px;
    }

    .button-group {
      display: flex;
      justify-content: flex-start;
      gap: 10px;
      margin-bottom: 20px;
    }

    @media (max-width: 500px) {
      .group-wrapper {
        flex-direction: column;
        align-items: flex-start;
      }

      .group {
        width: 100%;
      }

      .button-group {
        flex-direction: column;
        align-items: flex-start;
      }
    }
  </style>
</head>

<body>
  <h1>밴픽 데이터 불러오기</h1>
  <div class="button-group">
    <button id="refresh-btn">업데이트</button>
    <button id="delete-btn">데이터 삭제</button>
  </div>
  <div id="banPickList"></div>

  <script>
    function loadData() {
      fetch("/users/data")
        .then(res => res.json())
        .then(data => {
          const list = document.getElementById("banPickList");
          list.innerHTML = "";
          
          // ban, pick을 created_at 기준으로 정렬된 상태라고 가정하고, 최신순으로 그룹화
          const groupSize = 10;
          const total = Math.min(data.ban.length, data.pick.length);
          const groupCount = Math.floor(total / groupSize);

          for (let i = groupCount - 1; i >= 0; i--) {
            const wrapper = document.createElement("div");
            wrapper.className = "group-wrapper";

            const checkbox = document.createElement("input");
            checkbox.type = "checkbox";
            checkbox.className = "group-checkbox";
            checkbox.style.marginRight = "10px";
            wrapper.appendChild(checkbox);

            const group = document.createElement("div");
            group.className = "group";
            wrapper.appendChild(group);
            // 그룹 클릭 시 체크박스 상태 토글
            group.style.cursor = "pointer";
            group.addEventListener("click", () => {
              checkbox.checked = !checkbox.checked;
            });

            const start = i * groupSize;

            // 각 그룹의 밴/픽 가져오기
            const groupBans = data.ban.slice(start, start + 10);
            const groupPicks = data.pick.slice(start, start + 10);

            // 밴 섹션
            const banTitle = document.createElement("div");
            banTitle.className = "section-title";
            banTitle.textContent = `${i + 1}번째 그룹 벤 데이터`;
            group.appendChild(banTitle);

            ["blue", "red"].forEach(team => {
              const teamTag = document.createElement("div");
              teamTag.className = "team";
              teamTag.innerHTML = `<span>${team}: </span>` +
                groupBans
                  .filter(champ => champ.team === team)
                  .map(champ => `<span class="champ">${champ.name}</span>`)
                  .join('');
              group.appendChild(teamTag);
            });

            // 픽 섹션
            const pickTitle = document.createElement("div");
            pickTitle.className = "section-title";
            pickTitle.textContent = `${i + 1}번째 그룹 픽 데이터`;
            group.appendChild(pickTitle);

            ["blue", "red"].forEach(team => {
              const teamTag = document.createElement("div");
              teamTag.className = "team";
              teamTag.innerHTML = `<span>${team}: </span>` +
                groupPicks
                  .filter(champ => champ.team === team)
                  .map(champ => `<span class="champ">${champ.name}</span>`)
                  .join('');
              group.appendChild(teamTag);
            });

            list.appendChild(wrapper);
          }
        })
        .catch(err => console.error("데이터 불러오기 실패:", err));
    }

    function deleteData() {
      const checkboxes = document.querySelectorAll(".group-checkbox");
      const indexesToDelete = [];
  
      checkboxes.forEach((checkbox, index) => {
        if (checkbox.checked) {
          indexesToDelete.push(index);
        }
      });
  
      if (indexesToDelete.length === 0) {
        alert("삭제할 그룹을 선택하세요.");
        return;
      }
  
      fetch("/users/delete", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({ indexes: indexesToDelete })
      })
      .then(res => {
        if (!res.ok) throw new Error("삭제 요청 실패");
        return res.json();
      })
      .then(result => {
        alert("삭제가 완료되었습니다.");
        loadData();
      })
      .catch(err => {
        console.error("삭제 중 오류 발생:", err);
        alert("삭제 중 오류가 발생했습니다.");
      });
    }
    
    document.getElementById("delete-btn").addEventListener("click", deleteData);
    document.getElementById("refresh-btn").addEventListener("click", loadData);

    loadData();
  </script>
</body>

</html>
