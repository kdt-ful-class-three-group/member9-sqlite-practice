<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8" />
  <title>밴픽 결과</title>
  <style>
    body {
      padding: 20px;
    }

    .group-wrapper {
      display: flex;
      align-items: center;
      justify-content: flex-start;
      margin-bottom: 30px;
    }

    .group {
      width: 100%;
      max-width: 400px;
      min-height: 150px;
      border: 2px solid #888;
      padding: 16px;
      margin-bottom: 20px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    }

    .section-title {
      font-weight: bold;
      margin-top: 10px;
    }

    .team {
      margin-left: 10px;
    }

    .champ {
      display: inline-block;
      margin-right: 8px;
    }

    .button-group {
      display: flex;
      justify-content: flex-start;
      gap: 10px;
      margin-bottom: 20px;
    }

    @media (max-width: 500px) {
      .group-wrapper {
        flex-direction: column;
        align-items: flex-start;
      }

      .group {
        width: 100%;
      }

      .button-group {
        flex-direction: column;
        align-items: flex-start;
      }
    }
  </style>
</head>

<body>
  <h1>밴픽 데이터 불러오기</h1>
  <div class="button-group">
    <button id="refresh-btn">업데이트</button>
    <button id="delete-btn">데이터 삭제</button>
  </div>
  <div id="banPickList"></div>

  <script type="module" src="./js/index.js"></script>
</body>

</html>
